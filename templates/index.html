<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Q&amp;A</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M12 9v14l11-7z' fill='white'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <span class="brand-name">Lecture Q&amp;A</span>
            </div>
            <p class="video-title" id="videoTitle"></p>
            <button class="btn btn-ghost" id="newVideoBtn" hidden>새 영상</button>
        </div>
    </header>

    <main class="container">
        <!-- Start: pick a video -->
        <section class="start" id="startSection">
            <h1>강의 영상을 보다가 멈추고 물어보세요</h1>
            <p class="lead">음성을 자막으로 만든 뒤, 멈춘 지점의 강의 내용을 근거로 답하고 답에 나온 장면으로 바로 이동할 수 있게 해 드려요.</p>

            <label class="drop-zone" id="dropZone" for="videoInput">
                <span class="drop-title">영상 파일을 끌어다 놓거나 클릭해서 선택</span>
                <span class="drop-hint" id="limitHint">MP4 또는 WebM</span>
                <input type="file" id="videoInput" accept="video/mp4,video/webm,video/quicktime,.mp4,.m4v,.mov,.webm" class="visually-hidden">
            </label>

            <div class="or"><span>또는</span></div>

            <form class="url-form" id="youtubeForm">
                <input type="text" id="youtubeUrl" class="text-input" placeholder="YouTube 영상 주소 (예: https://youtu.be/...)" autocomplete="off">
                <button type="submit" class="btn btn-primary" id="loadYoutube">불러오기</button>
            </form>
        </section>

        <!-- Workspace: player, transcript and chat -->
        <section class="workspace" id="workspace" hidden>
            <div class="main-column">
                <div class="player" id="playerBox">
                    <video id="videoPlayer" controls playsinline hidden></video>
                    <div id="ytMount" class="yt-mount" hidden></div>
                </div>

                <div class="job-status" id="jobStatus" hidden>
                    <div class="job-status-row">
                        <span id="jobStatusText">처리 중...</span>
                        <span id="jobStatusPercent">0%</span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
                </div>

                <div class="panel transcript-panel">
                    <div class="panel-header">
                        <h2>자막</h2>
                        <span class="panel-meta" id="transcriptMeta"></span>
                    </div>
                    <ol class="transcript" id="transcriptList">
                        <li class="transcript-empty">자막을 만드는 중이에요.</li>
                    </ol>
                </div>
            </div>

            <aside class="panel chat-panel">
                <div class="panel-header">
                    <h2>질문</h2>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message">
                        <p>궁금한 곳에서 질문하면 영상이 멈추고, 강의 내용을 근거로 답해 드려요.</p>
                        <p class="hint">답변의 시간 표시를 누르면 그 장면으로 이동해요.</p>
                    </div>
                </div>
                <form class="chat-input-wrapper" id="chatForm">
                    <input type="text" id="chatInput" class="text-input" placeholder="자막을 만드는 중이에요..." maxlength="1000" autocomplete="off" disabled>
                    <button type="submit" id="sendBtn" class="btn btn-primary btn-send" aria-label="질문 보내기" disabled>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </form>
            </aside>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
