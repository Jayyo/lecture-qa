services:
  app:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY: "1"
      TZ: Asia/Seoul
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-300}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
